name: Build synthetic analytics dataset
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_data.py'
      - 'scripts/audit_data.py'
      - 'scripts/analyze_costs.py'
      - '.github/workflows/build-data.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-data-build
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate CSV, JSON and SQLite
        run: python scripts/build_data.py
      - name: Audit Python, SQL and dashboard metrics
        run: python scripts/audit_data.py
      - name: Analyze operational costs and score thresholds
        run: python scripts/analyze_costs.py
      - name: Commit and push data with safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transacoes.json data/transacoes.csv data/atlas.sqlite data/auditoria_metricas.json data/analise_custos.csv data/analise_custos.json ANALISE_CUSTO_OPERACIONAL.md
          if git diff --cached --quiet; then
            echo "No changes to generated data"
            exit 0
          fi
          git commit -m "Generate reproducible synthetic analytics data"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Published generated data successfully"
              exit 0
            fi
            echo "Remote branch advanced; retrying ($attempt/5)"
            sleep 2
          done
          echo "Failed to push after five safe retries" >&2
          exit 1
