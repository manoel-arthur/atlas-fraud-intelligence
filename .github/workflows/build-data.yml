name: Build synthetic analytics dataset
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_data.py'
      - '.github/workflows/build-data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate CSV, JSON and SQLite
        run: python scripts/build_data.py
      - name: Commit reproducible data outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transacoes.json data/transacoes.csv data/atlas.sqlite
          git diff --cached --quiet || (git commit -m "Generate reproducible synthetic analytics data" && git push)
